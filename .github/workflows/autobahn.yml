name: Autobahn

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            extra-substituters = https://anmonteiro.nix-cache.workers.dev
            extra-trusted-public-keys = ocaml.nix-cache.com-1:/xI2h2+56rwFfKyyFVbkJSeGqSIYMC/Je+7XXqGKDIY=
      - name: Build Eio Autobahn testee
        run: >
          nix-shell ./nix/ci/test.nix --argstr ocamlVersion 5_2
          --run 'dune build examples/eio/autobahn_testee.exe'
      - name: Run Eio Autobahn testee
        run: |
          nix-shell ./nix/ci/test.nix --argstr ocamlVersion 5_2 \
            --run '_build/default/examples/eio/autobahn_testee.exe -p 9001' \
            >"$RUNNER_TEMP/autobahn-testee.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/autobahn-testee.pid"
      - name: Wait for testee
        run: |
          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 9001; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/autobahn-testee.log"
          exit 1
      - name: Run Autobahn fuzzing client
        run: |
          mkdir -p "$RUNNER_TEMP/autobahn-reports"
          docker run --rm --network host \
            -v "$PWD/autobahn:/autobahn:ro" \
            -v "$RUNNER_TEMP/autobahn-reports:/reports" \
            crossbario/autobahn-testsuite \
            wstest -m fuzzingclient -s /autobahn/fuzzingclient-eio.json
      - name: Stop testee
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/autobahn-testee.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/autobahn-testee.pid")" || true
          fi
      - name: Upload Autobahn report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-eio-report
          path: |
            ${{ runner.temp }}/autobahn-reports
            ${{ runner.temp }}/autobahn-testee.log
